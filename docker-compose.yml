version: "3.9"

services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on: [db, redis]
    environment:
      - DATABASE_URL=postgresql+asyncpg://tecido:tecido123@db:5432/tecido
      - REDIS_URL=redis://redis:6379
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on: [api]
    environment:
      - VITE_API_URL=http://localhost:8000

  db:
    image: postgres:16-alpine
    volumes: [pgdata:/var/lib/postgresql/data]
    environment:
      POSTGRES_DB: tecido
      POSTGRES_USER: tecido
      POSTGRES_PASSWORD: tecido123
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
